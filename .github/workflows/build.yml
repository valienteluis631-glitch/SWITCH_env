name: Build SWITCH Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.8"
        activate-environment: switch_env
        auto-activate-base: false


    - name: Install SWITCH dependencies
      shell: bash -el {0}
      run: |

        pip install \
        anndata==0.9.2 \
        networkx==3.1 \
        numpy==1.22.4 \
        pandas==1.5.3 \
        pybedtools==0.9.1 \
        pynvml==11.5.0 \
        scanpy==1.9.8 \
        scikit_learn==1.3.2 \
        scipy==1.9.3 \
        torch_geometric==2.6.1 \
        tqdm==4.66.1 \
        scikit-misc==0.2.0


    - name: Install PyTorch CUDA 12.1
      shell: bash -el {0}
      run: |

        pip install \
        torch==2.1.1+cu121 \
        torchvision==0.16.1+cu121 \
        torchaudio==2.1.1+cu121 \
        --index-url https://download.pytorch.org/whl/cu121


    - name: Verify
      shell: bash -el {0}
      run: |

        python - <<EOF
        import torch
        import scanpy
        import torch_geometric

        print(torch.__version__)
        print(torch.version.cuda)
        print(torch.cuda.is_available())
        EOF


    - name: Install conda-pack
      shell: bash -el {0}
      run: |

        conda install -y conda-pack


    - name: Clean pip cache
      shell: bash -el {0}
      run: |

        pip cache purge


    - name: Pack environment
      shell: bash -el {0}
      run: |

        conda-pack \
        -n switch_env \
        -o switch_env.tar.gz


    - name: Upload environment
      uses: actions/upload-artifact@v4
      with:

        name: switch_env
        path: switch_env.tar.gz
